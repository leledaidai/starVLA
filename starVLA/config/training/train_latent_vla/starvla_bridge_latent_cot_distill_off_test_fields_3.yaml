run_id: latent_cot_full_loss
run_root_dir: results/Checkpoints
seed: 42
trackers: [jsonl, wandb]
wandb_entity: your_wandb_entity
wandb_project: latent_vla_full_loss
is_debug: false

cot:
  eval_mode: student
  enable_teacher_cot_loss: false
  enable_teacher_action_loss: false
  enable_student_action_loss: true
  enable_decoder_loss: true
  enable_slot_distill_loss: false
  enable_pool_distill_loss: false

  teacher_cot_loss_weight: 0.0
  teacher_action_loss_weight: 0.0
  student_action_loss_weight: 1.0
  decoder_loss_weight: 0.5
  slot_distill_loss_weight: 0.0
  pool_distill_loss_weight: 0.0

  distill_loss_type: smooth_l1
  distill_loss_div_std: true
  max_cot_length: 550
  teacher_max_prompt_length: 750
  student_max_prompt_length: 230
  decoder_type: qwen_text
  decoder_model_path: ./playground/Pretrained_models/Qwen3-1.7B
  latent_forward_use_cache: true
  decode_cot_in_inference: false
  thinking_token: "<|thinking|>"
  start_thinking_token: "<|start_of_thinking|>"
  end_thinking_token: "<|end_of_thinking|>"
  fields:
    - name: plan
    - name: subtask
    - name: move

framework:
  name: QwenGR00TImplicitCoT
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct-Action
    attn_implementation: sdpa
    vl_hidden_dim: 2048

  action_model:
    action_model_type: DiT-B
    hidden_size: 1024
    add_pos_embed: True
    max_seq_len: 1024
    action_dim: 7
    state_dim: 7
    future_action_window_size: 15
    action_horizon: 16
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null
  obs_image_size: [224, 224]

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /inspire/hdd/global_user/gongjingjing-25039/zhdai/datasets
    data_mix: bridge_train_cot
    action_type: delta_ee
    skip_empty_language: true
    delete_pause_frame: false
    video_backend: torchvision_av
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    CoT_answer: bbox
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 1
    obs: ["image_0"]
    image_size: [224,224]

trainer:
  epochs: 100
  max_train_steps: 100000
  num_warmup_steps: 10000
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 1e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  save_format: pt
  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
