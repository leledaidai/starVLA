runtime:
  server_python: /root/miniconda3/envs/starVLA/bin/python
  sim_python: /root/miniconda3/envs/simpler_env/bin/python
  simpler_env_path: /inspire/hdd/global_user/gongjingjing-25039/zhdai/starVLA/benchmark_env/SimplerEnv
  extra_env:
    VK_ICD_FILENAMES: /inspire/hdd/global_user/gongjingjing-25039/zhdai/starVLA/local_nvidia_icd.json
    DISPLAY: ""
    PYTHONUNBUFFERED: "1"

server:
  host: 127.0.0.1
  use_bf16: true
  start_timeout_sec: 180
  port_range: [26689, 26888]

eval_defaults:
  policy_setup: widowx_bridge
  action_scale: 1.0
  control_freq: 5
  sim_freq: 500
  max_episode_steps: 120
  obj_variation_mode: episode
  obj_episode_range: [0, 24]
  robot_init_rot_quat_center: [0, 0, 0, 1]
  robot_init_rot_rpy_range: [0, 0, 1, 0, 0, 1, 0, 0, 1]
  per_task_timeout_min: 1440
  repeats: 1
  logging_subdir: simpler_env_results

tasks:
  - name: StackGreenCubeOnYellowCubeBakedTexInScene-v0
    env_name: StackGreenCubeOnYellowCubeBakedTexInScene-v0
    scene_name: bridge_table_1_v1
    robot: widowx
    rgb_overlay_path: /inspire/hdd/global_user/gongjingjing-25039/zhdai/starVLA/benchmark_env/SimplerEnv/ManiSkill2_real2sim/data/real_inpainting/bridge_real_eval_1.png
    robot_init_x_range: [0.147, 0.147, 1]
    robot_init_y_range: [0.028, 0.028, 1]

  - name: PutCarrotOnPlateInScene-v0
    env_name: PutCarrotOnPlateInScene-v0
    scene_name: bridge_table_1_v1
    robot: widowx
    rgb_overlay_path: /inspire/hdd/global_user/gongjingjing-25039/zhdai/starVLA/benchmark_env/SimplerEnv/ManiSkill2_real2sim/data/real_inpainting/bridge_real_eval_1.png
    robot_init_x_range: [0.147, 0.147, 1]
    robot_init_y_range: [0.028, 0.028, 1]

  - name: PutSpoonOnTableClothInScene-v0
    env_name: PutSpoonOnTableClothInScene-v0
    scene_name: bridge_table_1_v1
    robot: widowx
    rgb_overlay_path: /inspire/hdd/global_user/gongjingjing-25039/zhdai/starVLA/benchmark_env/SimplerEnv/ManiSkill2_real2sim/data/real_inpainting/bridge_real_eval_1.png
    robot_init_x_range: [0.147, 0.147, 1]
    robot_init_y_range: [0.028, 0.028, 1]

  - name: PutEggplantInBasketScene-v0
